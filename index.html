<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f9ef"><title>Conjugaison — Le Jeu</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{font-family:Verdana,sans-serif;color:#24483b;background:#f4f9ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{height:100dvh}main{height:100%;max-width:540px;margin:auto;padding:clamp(8px,2vh,20px) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:clamp(7px,1.4vh,15px)}header{text-align:center;flex:none}h1{font-family:Fredoka,sans-serif;font-size:clamp(30px,6.5vh,52px);line-height:1.05;margin:0;color:#287454}h1 a{color:inherit;text-decoration:none;cursor:pointer}h1 a:focus-visible{outline:2px solid #287454;outline-offset:3px}header p{font-family:Fredoka,sans-serif;font-size:clamp(15px,2.5vh,21px);margin:0;color:#68977b}.panel{background:white;border:1px solid #d2e6d6;border-radius:20px;padding:clamp(12px,2.6vh,23px);box-shadow:0 7px 25px #234b3310;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,1.8vh,18px)}.hide{display:none!important}h2{font-family:Fredoka,sans-serif;font-size:clamp(20px,3.5vh,29px);text-align:center;margin:0}.muted{text-align:center;color:#688072;font-size:clamp(12px,1.8vh,15px);margin:0}.levels{display:grid;gap:10px}button{font-family:Fredoka,sans-serif;font-weight:600;border-radius:13px;border:2px solid #cfe3d4;padding:clamp(9px,2vh,16px);font-size:clamp(17px,2.7vh,22px);background:#fff;color:#285b45;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #e9a94d;outline-offset:2px}.level.selected{background:#e4f4e9;border-color:#27845b}.primary{background:#27845b;color:white;border-color:#27845b;width:100%}.top{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka,sans-serif;font-size:clamp(14px,2vh,18px)}.bar{height:9px;background:#e2eee5;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#55ac75;transition:width .2s}.prompt{text-align:center;display:flex;flex-direction:column;justify-content:center;gap:clamp(5px,1vh,11px);flex:1;min-height:0}.verb{font-family:Fredoka,sans-serif;font-size:clamp(26px,5vh,42px);font-weight:600;overflow-wrap:anywhere}.tense{font-size:clamp(14px,2.4vh,19px);color:#567465}.person{font-family:Fredoka,sans-serif;font-size:clamp(20px,3.4vh,29px)}.answers{display:grid;gap:clamp(7px,1.3vh,12px)}.answer{width:100%;min-height:clamp(43px,8vh,69px);overflow-wrap:anywhere}.answer.good{background:#d8f5df;color:#14683b;border-color:#299d59}.answer.bad{background:#ffe0e0;color:#a62d37;border-color:#d95b61}.answer:disabled{opacity:1;cursor:default}.feedback{min-height:1.5em;text-align:center;font-family:Fredoka,sans-serif;font-size:clamp(14px,2vh,18px)}.bottom{min-height:clamp(44px,7vh,58px)}footer{text-align:center;font-size:11px;color:#73917c;flex:0 0 auto;min-height:18px;line-height:18px;display:block!important;visibility:visible!important;opacity:1!important;position:relative;z-index:2}@media(max-height:610px){main{gap:5px;padding-top:5px}.panel{gap:6px;padding:9px}.answer{min-height:37px;padding:6px}.bottom{min-height:37px}header p{font-size:13px}h1{font-size:29px}.prompt{gap:3px}.verb{font-size:25px}.person{font-size:19px}footer{font-size:10px;min-height:15px;line-height:15px}}@media(max-height:440px){header p{display:none}.panel{gap:3px}.answer{min-height:30px;padding:3px;font-size:15px}.bottom{min-height:30px}.verb{font-size:20px}.tense{font-size:12px}.person{font-size:16px}}
</style></head><body><main><header><h1><a href="./" id="home">Conjugaison</a></h1><p>Le Jeu</p></header><section class="panel" id="start"><h2>Choisis ta difficulté</h2><div class="levels"><button class="level" data-level="easy">Facile</button><button class="level selected" data-level="normal">Normal</button><button class="level" data-level="hard">Difficile</button></div><button class="primary" id="play">Jouer</button></section><section class="panel hide" id="game"><div class="top"><span id="number">Question 1 / 10</span><span id="score">Score : 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="prompt"><div class="verb" id="verb"></div><div class="tense" id="tense"></div><div class="person" id="person"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="bottom"><button class="primary hide" id="next">Question suivante</button></div></section><section class="panel hide" id="end"><h2>Partie terminée !</h2><h2 id="final"></h2><p class="muted" id="message"></p><button class="primary" id="again">Rejouer</button></section><footer>© Pierre Lemétayer – 2026</footer></main><script src="data.js"></script><script>
"use strict";
const ALL=["indicatif_présent","indicatif_imparfait","indicatif_passé_composé","indicatif_plus_que_parfait","indicatif_passé_simple","indicatif_futur_simple","indicatif_passé_antérieur","indicatif_futur_antérieur","conditionnel_présent","conditionnel_passé","subjonctif_présent","subjonctif_passé","impératif_présent"];
const EXTRAS={easy:["indicatif_présent","indicatif_imparfait","indicatif_passé_composé","indicatif_plus_que_parfait","indicatif_passé_simple","indicatif_futur_simple"],normal:ALL.filter(t=>!["indicatif_passé_antérieur","indicatif_futur_antérieur","subjonctif_passé","conditionnel_passé"].includes(t)),hard:ALL};
const LABEL={"indicatif_présent":"Présent de l'indicatif","indicatif_imparfait":"Imparfait de l'indicatif","indicatif_passé_composé":"Passé composé","indicatif_plus_que_parfait":"Plus-que-parfait","indicatif_passé_simple":"Passé simple","indicatif_futur_simple":"Futur simple","indicatif_passé_antérieur":"Passé antérieur","indicatif_futur_antérieur":"Futur antérieur","conditionnel_présent":"Conditionnel présent","conditionnel_passé":"Conditionnel passé","subjonctif_présent":"Subjonctif présent","subjonctif_passé":"Subjonctif passé","impératif_présent":"Impératif présent"};
const $=id=>document.getElementById(id);let level="normal",questions=[],index=0,points=0,answered=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const key=r=>r.v+"|"+r.p;
function build(){const allowed=new Set(EXTRAS[level]);const groups=new Map();for(const r of DATA){if(!allowed.has(r.t))continue;const k=key(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
const candidates=[];for(const rows of groups.values()){for(const r of rows){const correct=r.a[0];const wrong=[...new Set(rows.filter(x=>x.t!==r.t).flatMap(x=>x.a))].filter(x=>!r.a.includes(x));if(wrong.length>=2)candidates.push({r,wrong})}}
const byT=new Map();for(const c of shuffle(candidates)){if(!byT.has(c.r.t))byT.set(c.r.t,[]);byT.get(c.r.t).push(c)}
const chosen=[],usedVerbs=new Set(),counts=new Map();const tenses=shuffle([...byT.keys()]);let progress=true;while(chosen.length<10&&progress){progress=false;for(const t of shuffle(tenses)){if(chosen.length>=10)break;if((counts.get(t)||0)>=2)continue;const pool=byT.get(t)||[];const c=pool.find(x=>!usedVerbs.has(x.r.v));if(!c)continue;chosen.push(c);usedVerbs.add(c.r.v);counts.set(t,(counts.get(t)||0)+1);progress=true}}
if(chosen.length!==10)throw Error("Impossible de composer dix questions distinctes");return shuffle(chosen).map(c=>({...c,options:shuffle([c.r.a[0],...shuffle(c.wrong).slice(0,2)])}))}
function screen(id){for(const x of ["start","game","end"])$(x).classList.toggle("hide",x!==id)}
document.querySelectorAll(".level").forEach(b=>b.addEventListener("click",()=>{level=b.dataset.level;document.querySelectorAll(".level").forEach(x=>x.classList.toggle("selected",x===b))}));
function start(){try{questions=build()}catch(e){alert("Impossible de préparer la partie. Réessaie.");return}index=0;points=0;screen("game");render()}
function render(){answered=false;const q=questions[index];$("number").textContent="Question "+(index+1)+" / 10";$("score").textContent="Score : "+points;$("fill").style.width=(index/10*100)+"%";$("verb").textContent=q.r.v;$("tense").textContent=LABEL[q.r.t];$("person").textContent=q.r.p==="je"?"Je / J’ …":q.r.p.charAt(0).toUpperCase()+q.r.p.slice(1)+" …";$("feedback").textContent="";$("next").classList.add("hide");$("answers").replaceChildren();q.options.forEach(a=>{const b=document.createElement("button");b.className="answer";b.textContent=a;b.addEventListener("click",()=>choose(a));$("answers").append(b)})}
function choose(a){if(answered)return;answered=true;const q=questions[index],correct=q.r.a.includes(a);if(correct)points++;for(const b of $("answers").children){b.disabled=true;if(q.r.a.includes(b.textContent))b.classList.add("good");else if(b.textContent===a)b.classList.add("bad")} $("score").textContent="Score : "+points;$("feedback").textContent=correct?"Bonne réponse !":"La bonne réponse est en vert.";$("next").textContent=index===9?"Résultats":"Question suivante";$("next").classList.remove("hide")}
$("next").addEventListener("click",()=>{index++;if(index===10){$("fill").style.width="100%";$("final").textContent=points+" / 10";$("message").textContent=points===10?"Sans faute !":points>=8?"Très belle partie !":points>=5?"Bien joué, continue !":"Continue à t'entraîner !";screen("end")}else render()});
$("play").addEventListener("click",start);$("again").addEventListener("click",()=>screen("start"));$("home").addEventListener("click",e=>{if(!$("game").classList.contains("hide")){e.preventDefault();if(confirm("Quitter la partie et revenir à l'accueil ?"))screen("start")}});window.addEventListener("beforeunload",e=>{if(!$("game").classList.contains("hide")){e.preventDefault();e.returnValue=""}});
</script></body></html>
